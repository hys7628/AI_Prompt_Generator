# Render 설정 파일 (Blueprint)
# Render 대시보드 → New → Blueprint → 이 저장소 선택하면 아래대로 자동 생성됩니다.
services:
  - type: web
    name: ai-prompt-generator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: OPENAI_API_KEY
        sync: false   # 대시보드에서 직접 입력 (코드에 남기지 않음)
      - key: APP_PASSWORD
        sync: false
