<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 프롬프트 생성기</title>
  <!-- 휴대폰: 주소창 색, 홈 화면에 추가했을 때 앱처럼 보이게 -->
  <meta name="theme-color" content="#f4effc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1726" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="프롬프트">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- 제목·버튼용 귀여운 둥근 글꼴 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ───── 비밀번호 화면 ───── -->
  <div id="login" class="overlay" hidden>
    <form id="loginForm" class="login-box">
      <h2>🔒 비밀번호</h2>
      <p class="muted">내 OpenAI 키로 동작하는 사이트라 비밀번호가 필요해요.</p>
      <input id="pw" type="password" placeholder="접속 비밀번호" autocomplete="current-password" required>
      <button class="btn primary" type="submit">들어가기</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>

  <header class="top">
    <h1>✨ AI 프롬프트 생성기</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="generator">생성기</button>
      <button class="tab" data-tab="library">기법 카드</button>
    </nav>
  </header>

  <main>
    <!-- ───── 탭 1 : 생성기 ───── -->
    <section id="generator" class="panel">
      <form id="taskForm" class="card form">
        <!-- 말 거는 캐릭터 -->
        <div class="mascot">
          <span class="buddy" aria-hidden="true"></span>
          <p class="bubble">어떤 작업을 도와줄까요?</p>
        </div>
        <label><span>작업 <span class="req">*</span></span>
          <textarea id="task" rows="2" placeholder="예) 고객 클레임 이메일 답장 작성" required></textarea>
        </label>
        <label>원하는 결과물
          <textarea id="goal" rows="2" placeholder="예) 고객이 화가 풀리고 우리 회사를 신뢰하게 하는 답장"></textarea>
        </label>
        <label>피해야 할 것
          <textarea id="avoid" rows="2" placeholder="예) 방어적 태도, 책임 회피, 형식적인 사과"></textarea>
        </label>
        <div id="forced" class="forced" hidden></div>
        <div class="row">
          <button type="button" id="fillExample" class="btn">예시 채우기</button>
          <button type="submit" id="recommendBtn" class="btn primary">🔍 기법 추천받기</button>
        </div>
      </form>

      <div id="status" class="status" hidden></div>

      <!-- 추천 대시보드 -->
      <div id="dashboard" hidden>
        <p id="summary" class="summary"></p>
        <div id="recCards" class="rec-grid"></div>
      </div>

      <!-- APE 최종 결과 -->
      <div id="final" class="card final" hidden></div>
    </section>

    <!-- ───── 탭 2 : 기법 카드 ───── -->
    <section id="library" class="panel" hidden>
      <div class="filters">
        <input id="search" type="search" placeholder="기법 검색 (예: 페르소나, 협상)">
        <div class="chips" id="topicChips"></div>
      </div>
      <div id="techGrid" class="topic-list"></div>
    </section>
  </main>

  <footer class="foot muted">AI가 만든 결과는 초안이에요. 숫자·사실은 꼭 직접 확인하세요.</footer>

  <script src="app.js"></script>
</body>
</html>
